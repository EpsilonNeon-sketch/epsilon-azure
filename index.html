<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epsilon Azure | BMS Tool</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        azure: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
                            400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
                            800: '#075985', 900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0284c7;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-700 h-screen overflow-hidden flex flex-col">

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-gradient-to-br from-white to-blue-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-blue-100 w-full max-w-md p-8 fade-in">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-blue-600 text-white mb-4 shadow-lg shadow-blue-200">
                    <i data-lucide="box" class="w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Epsilon Azure</h1>
                <p class="text-slate-500 text-sm mt-1">Business Management System</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email</label>
                    <input type="email" id="login-email" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition" placeholder="you@company.com" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" id="login-password" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-lg shadow-blue-200">Sign In</button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-slate-500">Don't have a business account?</p>
                <button onclick="toggleAuthMode()" class="text-blue-600 font-semibold text-sm hover:underline">Create Business Account</button>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="signup-form-container" class="hidden bg-white rounded-2xl shadow-xl border border-blue-100 w-full max-w-md p-8 fade-in absolute">
            <div class="text-center mb-6">
                <h2 class="text-xl font-bold text-slate-800">Register Business</h2>
            </div>
            <form id="signup-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Business Name</label>
                    <input type="text" id="signup-biz-name" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email</label>
                    <input type="email" id="signup-email" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" id="signup-password" class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-lg shadow-blue-200">Sign Up & Setup</button>
            </form>
            <button onclick="toggleAuthMode()" class="mt-4 w-full text-center text-sm text-slate-500 hover:text-blue-600">Back to Login</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-layout" class="flex h-screen hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shadow-sm z-10">
            <div class="p-6 flex items-center gap-3 border-b border-slate-100">
                <div class="w-8 h-8 rounded bg-blue-600 flex items-center justify-center text-white">
                    <i data-lucide="box" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-800 tracking-tight">Epsilon Azure</h1>
                    <p class="text-[10px] text-blue-500 font-bold uppercase tracking-wider">BMS Tool</p>
                </div>
            </div>

            <nav class="flex-1 overflow-y-auto p-4 space-y-1">
                <button onclick="router('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg bg-blue-50 text-blue-700 transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                </button>
                <button onclick="router('customers')" id="nav-customers" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition">
                    <i data-lucide="users" class="w-4 h-4"></i> Customers
                </button>
                <button onclick="router('employees')" id="nav-employees" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition">
                    <i data-lucide="user-cog" class="w-4 h-4"></i> Employees
                </button>
                <button onclick="router('assets')" id="nav-assets" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition">
                    <i data-lucide="package" class="w-4 h-4"></i> Assets
                </button>
                <button onclick="router('products')" id="nav-products" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i> Products
                </button>
                <button onclick="router('services')" id="nav-services" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition">
                    <i data-lucide="wrench" class="w-4 h-4"></i> Services
                </button>
                <button onclick="router('delivery')" id="nav-delivery" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition">
                    <i data-lucide="truck" class="w-4 h-4"></i> Delivery
                </button>
            </nav>

            <div class="p-4 border-t border-slate-100">
                <button onclick="router('settings')" id="nav-settings" class="nav-item w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 rounded-lg hover:bg-slate-50 hover:text-slate-900 transition">
                    <i data-lucide="settings" class="w-4 h-4"></i> Settings
                </button>
                <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-red-500 rounded-lg hover:bg-red-50 transition mt-1">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Sign Out
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 bg-slate-50 overflow-auto relative">
            <!-- Header -->
            <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-10">
                <div>
                    <h2 id="page-title" class="text-lg font-bold text-slate-800">Dashboard</h2>
                    <p id="page-subtitle" class="text-xs text-slate-500">Overview of your business</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right hidden sm:block">
                        <p id="header-biz-name" class="text-sm font-bold text-slate-800">Loading...</p>
                        <p id="header-user-email" class="text-xs text-slate-500">user@example.com</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center border border-blue-200">
                        <i data-lucide="building-2" class="w-5 h-5"></i>
                    </div>
                </div>
            </header>

            <!-- Dynamic Content Container -->
            <div id="content-area" class="p-8 max-w-7xl mx-auto">
                <!-- Content injected via JS -->
            </div>
        </main>
    </div>

    <!-- GENERIC MODAL FOR ADDING ITEMS -->
    <div id="item-modal" class="fixed inset-0 z-50 bg-black/50 hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 fade-in">
            <h3 id="modal-title" class="text-lg font-bold text-slate-800 mb-4">Add New Item</h3>
            <form id="modal-form" class="space-y-4">
                <input type="hidden" id="modal-table-name">
                <!-- Dynamic Inputs generated by JS -->
                <div id="modal-fields" class="space-y-3"></div>
                
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium text-sm">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium text-sm shadow-lg shadow-blue-200">Save Item</button>
                </div>
            </form>
        </div>
    </div>

        <script>
        // --- 1. SUPABASE SETUP ---
        const { createClient } = supabase;
        const supabaseClient = createClient(
            'https://gfsqzkyviivhvyqadpeg.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdmc3F6a3l2aWl2aHZ5cWFkcGVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0NDI0NDQsImV4cCI6MjA4NjAxODQ0NH0.MwC6dMZKFZMyklCJKqr4DPek8dxR-EswBZSd1L_AkMA',
            { auth: { persistSession: true, storageKey: 'ep-auth' } }
        );

        // --- 2. STATE ---
        let currentUser = null;
        let currentBusiness = null;

        // --- 3. TABLE CONFIGURATIONS (For Modal Generation) ---
        const tableConfigs = {
            earm_customers: [
                { key: 'name', label: 'Customer Name', type: 'text', required: true },
                { key: 'email', label: 'Email Address', type: 'email', required: false },
                { key: 'status', label: 'Status', type: 'select', options: ['Lead', 'Active', 'Inactive'], required: true },
                { key: 'phone', label: 'Phone Number', type: 'text', required: false }
            ],
            earm_employees: [
                { key: 'name', label: 'Employee Name', type: 'text', required: true },
                { key: 'role', label: 'Role/Title', type: 'text', required: true },
                { key: 'email', label: 'Work Email', type: 'email', required: false }
            ],
            earm_assets: [
                { key: 'name', label: 'Asset Name', type: 'text', required: true },
                { key: 'type', label: 'Asset Type', type: 'text', required: true },
                { key: 'status', label: 'Status', type: 'select', options: ['Good', 'Maintenance', 'Retired'], required: true }
            ],
            earm_products: [
                { key: 'name', label: 'Product Name', type: 'text', required: true },
                { key: 'sku', label: 'SKU Code', type: 'text', required: true },
                { key: 'price', label: 'Price', type: 'number', required: false }
            ],
            earm_services: [
                { key: 'name', label: 'Service Name', type: 'text', required: true },
                { key: 'duration', label: 'Duration', type: 'text', required: false, placeholder: 'e.g. 1 hour' }
            ],
            earm_delivery: [
                { key: 'tracking', label: 'Tracking ID', type: 'text', required: true },
                { key: 'destination', label: 'Destination', type: 'text', required: true },
                { key: 'status', label: 'Status', type: 'select', options: ['Pending', 'In Transit', 'Delivered'], required: true }
            ]
        };

        // --- 4. INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            
            // Check for existing session
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session) {
                currentUser = session.user;
                await loadBusinessData();
                showApp();
            } else {
                showAuth();
            }

            // Listen for auth changes (Login/Logout)
            supabaseClient.auth.onAuthStateChange(async (_event, session) => {
                if (_event === 'SIGNED_IN' && session) {
                    currentUser = session.user;
                    await loadBusinessData();
                    showApp();
                } else if (_event === 'SIGNED_OUT') {
                    currentUser = null;
                    currentBusiness = null;
                    showAuth();
                }
            });
        });

        // --- 5. AUTH & BUSINESS LOGIC ---

        function toggleAuthMode() {
            const loginForm = document.getElementById('login-form').parentElement;
            const signupContainer = document.getElementById('signup-form-container');
            
            loginForm.classList.toggle('hidden');
            signupContainer.classList.toggle('hidden');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Signing In...";
            btn.disabled = true;

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                showToast(error.message, 'error');
                btn.innerText = originalText;
                btn.disabled = false;
            }
            // Success is handled by onAuthStateChange
        });

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Creating Account...";
            btn.disabled = true;

            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const bizName = document.getElementById('signup-biz-name').value;

            // 1. Create Auth User
            const { data, error } = await supabaseClient.auth.signUp({ 
                email, password,
                options: { 
                    data: { business_name: bizName } // Store in metadata for recovery
                }
            });

            if (error) {
                showToast(error.message, 'error');
                btn.innerText = originalText;
                btn.disabled = false;
                return;
            }

            if (data.user) {
                showToast('Account created! Setting up business...', 'success');
                // 2. Create Business Profile immediately
                const dbError = await createBusinessProfile(data.user.id, bizName);
                
                if (dbError) {
                    console.error("Business creation failed:", dbError);
                    showToast('Account created, but business setup failed. Please contact support.', 'error');
                } else {
                    showToast('Setup complete! Redirecting...', 'success');
                }
            }
        });

        // Robust Business Profile Creation
        async function createBusinessProfile(userId, bizName) {
            const { error } = await supabaseClient.from('earm_businesses').insert([{
                user_id: userId, // Explicitly link user_id
                name: bizName,
                type: 'General',
                location: 'TBD'
            }]);
            return error;
        }

        // Robust Data Loading with Fallback
        async function loadBusinessData() {
            if (!currentUser) return;

            // Try to fetch business
            let { data, error } = await supabaseClient
                .from('earm_businesses')
                .select('*')
                .eq('user_id', currentUser.id)
                .maybeSingle(); // maybeSingle doesn't throw error if not found

            if (error) {
                console.error("Error fetching business:", error);
                showToast("Error loading business data.", "error");
                return;
            }

            if (data) {
                currentBusiness = data;
                updateHeader();
            } else {
                // FALLBACK: If business missing, try to recreate it from metadata
                console.warn("No business found for user. Attempting recovery...");
                const metaBizName = currentUser.user_metadata?.business_name || "My Business";
                
                const recoveryError = await createBusinessProfile(currentUser.id, metaBizName);
                
                if (!recoveryError) {
                    // Retry fetching
                    const { data: retryData } = await supabaseClient
                        .from('earm_businesses')
                        .select('*')
                        .eq('user_id', currentUser.id)
                        .single();
                    
                    if (retryData) {
                        currentBusiness = retryData;
                        updateHeader();
                        showToast("Business profile recovered!", "success");
                    }
                } else {
                    showToast("Critical: Business profile missing and could not be created.", "error");
                }
            }
        }

        function updateHeader() {
            if (currentBusiness) {
                document.getElementById('header-biz-name').textContent = currentBusiness.name;
                document.getElementById('header-user-email').textContent = currentUser.email;
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            showAuth();
        }

        // --- 6. ROUTING & VIEWS ---
        function showAuth() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app-layout').classList.add('hidden');
        }

        function showApp() {
            if (!currentBusiness) {
                showToast("Waiting for business setup...", "info");
                return;
            }
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-layout').classList.remove('hidden');
            router('dashboard');
        }

        function router(view) {
            // Update Sidebar UI
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('bg-blue-50', 'text-blue-700');
                el.classList.add('text-slate-600');
            });
            const activeBtn = document.getElementById(`nav-${view}`);
            if(activeBtn) {
                activeBtn.classList.add('bg-blue-50', 'text-blue-700');
                activeBtn.classList.remove('text-slate-600');
            }

            const content = document.getElementById('content-area');
            const title = document.getElementById('page-title');
            const sub = document.getElementById('page-subtitle');
            
            content.innerHTML = '';
            content.className = "p-8 max-w-7xl mx-auto fade-in";

            switch(view) {
                case 'dashboard':
                    title.innerText = 'Dashboard';
                    sub.innerText = 'Real-time business overview';
                    renderDashboard(content);
                    break;
                case 'customers':
                    title.innerText = 'Customers';
                    renderTablePage(content, 'earm_customers', ['Name', 'Email', 'Status', 'Phone']);
                    break;
                case 'employees':
                    title.innerText = 'Employees';
                    renderTablePage(content, 'earm_employees', ['Name', 'Role', 'Email']);
                    break;
                case 'assets':
                    title.innerText = 'Assets';
                    renderTablePage(content, 'earm_assets', ['Name', 'Type', 'Status']);
                    break;
                case 'products':
                    title.innerText = 'Products';
                    renderTablePage(content, 'earm_products', ['Name', 'SKU', 'Price']);
                    break;
                case 'services':
                    title.innerText = 'Services';
                    renderTablePage(content, 'earm_services', ['Name', 'Duration']);
                    break;
                case 'delivery':
                    title.innerText = 'Delivery';
                    renderTablePage(content, 'earm_delivery', ['Tracking ID', 'Destination', 'Status']);
                    break;
                case 'settings':
                    title.innerText = 'Settings';
                    renderSettings(content);
                    break;
            }
            lucide.createIcons();
        }

        // --- 7. RENDERERS ---

        // Dashboard with Real Counts
        async function renderDashboard(container) {
            // Helper to get counts
            const getCount = async (table) => {
                const { count, error } = await supabaseClient
                    .from(table)
                    .select('*', { count: 'exact', head: true })
                    .eq('business_id', currentBusiness.id); // Filter by business ID!
                return error ? 0 : count;
            };

            // Parallel requests for speed
            const [custCount, empCount, assetCount, prodCount] = await Promise.all([
                getCount('earm_customers'),
                getCount('earm_employees'),
                getCount('earm_assets'),
                getCount('earm_products')
            ]);

            const stats = [
                { label: 'Customers', val: custCount, icon: 'users', color: 'text-blue-600', bg: 'bg-blue-50' },
                { label: 'Employees', val: empCount, icon: 'user-cog', color: 'text-indigo-600', bg: 'bg-indigo-50' },
                { label: 'Assets', val: assetCount, icon: 'package', color: 'text-orange-600', bg: 'bg-orange-50' },
                { label: 'Products', val: prodCount, icon: 'shopping-bag', color: 'text-emerald-600', bg: 'bg-emerald-50' }
            ];

            const grid = document.createElement('div');
            grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8";
            
            stats.forEach(stat => {
                grid.innerHTML += `
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                        <div class="p-3 rounded-lg ${stat.bg} ${stat.color}">
                            <i data-lucide="${stat.icon}"></i>
                        </div>
                        <div>
                            <p class="text-sm text-slate-500 font-medium">${stat.label}</p>
                            <h3 class="text-2xl font-bold text-slate-800">${stat.val}</h3>
                        </div>
                    </div>
                `;
            });
            container.appendChild(grid);

            // Empty dashboard filler if no data
            if (custCount === 0 && empCount === 0) {
                container.innerHTML += `
                    <div class="bg-white p-8 rounded-xl border border-dashed border-slate-300 text-center">
                        <i data-lucide="layout-dashboard" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                        <h3 class="text-lg font-bold text-slate-700">Welcome to Epsilon Azure</h3>
                        <p class="text-slate-500 mb-4">Your business database is empty. Start by adding customers or employees.</p>
                        <button onclick="router('customers')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">Get Started</button>
                    </div>
                `;
            } else {
                 container.innerHTML += `
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                        <h3 class="text-lg font-bold text-slate-800 mb-4">System Status</h3>
                        <div class="flex items-center gap-2 text-green-600 font-medium text-sm bg-green-50 w-fit px-3 py-1 rounded-full">
                            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                            Connected to Supabase
                        </div>
                    </div>
                 `;
            }
        }

        // Generic Table Page Renderer
        async function renderTablePage(container, tableName, headers) {
            // Toolbar
            const toolbar = document.createElement('div');
            toolbar.className = "flex justify-between items-center mb-6";
            toolbar.innerHTML = `
                <div class="relative w-64">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="table-search" placeholder="Search..." class="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 w-full">
                </div>
                <button onclick="openAddModal('${tableName}')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition shadow-lg shadow-blue-200">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add New
                </button>
            `;
            container.appendChild(toolbar);

            // Loading State
            const loader = document.createElement('div');
            loader.className = "flex justify-center py-10";
            loader.innerHTML = `<div class="loader"></div>`;
            container.appendChild(loader);

            // Fetch Real Data (SECURITY: Filter by business_id)
            const { data, error } = await supabaseClient
                .from(tableName)
                .select('*')
                .eq('business_id', currentBusiness.id); // CRITICAL FIX
            
            // Remove loader
            container.removeChild(loader);

            if (error) {
                console.error("Table Load Error:", error);
                container.innerHTML += `<div class="text-red-500 text-sm">Error loading data: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                // Empty State
                container.innerHTML += `
                    <div class="bg-white border border-slate-200 rounded-xl p-12 text-center shadow-sm">
                        <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="inbox" class="w-8 h-8 text-slate-400"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800">No items found</h3>
                        <p class="text-slate-500 mb-6">Your ${tableName.replace('earm_', '')} list is currently empty.</p>
                        <button onclick="openAddModal('${tableName}')" class="text-blue-600 font-medium hover:underline">Add your first item</button>
                    </div>
                `;
                return;
            }

            // Render Table
            const tableWrap = document.createElement('div');
            tableWrap.className = "bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden";
            
            const keys = Object.keys(data[0]).filter(k => k !== 'id' && k !== 'business_id' && k !== 'created_at');
            
            let html = `
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 text-slate-500 font-medium border-b border-slate-200">
                        <tr>
                            ${keys.map(k => `<th class="px-6 py-4 capitalize">${k.replace('_', ' ')}</th>`).join('')}
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach(row => {
                html += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                        ${keys.map(k => `<td class="px-6 py-4 text-slate-700">${row[k] || '-'}</td>`).join('')}
                        <td class="px-6 py-4 text-right">
                             <button onclick="deleteItem('${tableName}', '${row.id}')" class="text-red-500 hover:text-red-700 text-xs font-medium">Delete</button>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            tableWrap.innerHTML = html;
            container.appendChild(tableWrap);
            
            // Search functionality (Client side for demo)
            const searchInput = document.getElementById('table-search');
            if(searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const rows = tableWrap.querySelectorAll('tbody tr');
                    rows.forEach(row => {
                        const text = row.innerText.toLowerCase();
                        row.style.display = text.includes(term) ? '' : 'none';
                    });
                });
            }
        }

        // Settings Page
        function renderSettings(container) {
            const b = currentBusiness || {};
            const form = document.createElement('div');
            form.className = "bg-white rounded-xl border border-slate-200 shadow-sm p-8 max-w-2xl";
            form.innerHTML = `
                <div class="mb-6 pb-6 border-b border-slate-100">
                    <h3 class="text-lg font-bold text-slate-800">Business Profile</h3>
                </div>
                <form id="settings-form" class="space-y-5">
                    <div class="grid grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Business Name</label>
                            <input type="text" id="set-name" value="${b.name || ''}" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:border-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Type</label>
                            <select id="set-type" class="w-full px-4 py-2 border border-slate-200 rounded-lg bg-white">
                                <option ${b.type === 'Technology' ? 'selected' : ''}>Technology</option>
                                <option ${b.type === 'Retail' ? 'selected' : ''}>Retail</option>
                                <option ${b.type === 'Service' ? 'selected' : ''}>Service</option>
                                <option ${b.type === 'General' ? 'selected' : ''}>General</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Location</label>
                        <input type="text" id="set-loc" value="${b.location || ''}" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Description</label>
                        <textarea id="set-desc" rows="3" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:border-blue-500 outline-none">${b.description || ''}</textarea>
                    </div>
                    <div class="pt-4">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium shadow-lg shadow-blue-200">Save Changes</button>
                    </div>
                </form>
            `;
            container.appendChild(form);

            document.getElementById('settings-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const update = {
                    name: document.getElementById('set-name').value,
                    type: document.getElementById('set-type').value,
                    location: document.getElementById('set-loc').value,
                    description: document.getElementById('set-desc').value
                };
                
                const { error } = await supabaseClient
                    .from('earm_businesses')
                    .update(update)
                    .eq('id', currentBusiness.id); // Update by ID, not user_id

                if (error) showToast(error.message, 'error');
                else {
                    currentBusiness = { ...currentBusiness, ...update };
                    document.getElementById('header-biz-name').textContent = update.name;
                    showToast('Business settings updated', 'success');
                }
            });
        }

        // --- 8. MODAL & CRUD LOGIC ---

        function openAddModal(tableName) {
            const config = tableConfigs[tableName];
            if (!config) return;

            document.getElementById('modal-table-name').value = tableName;
            document.getElementById('modal-title').innerText = `Add New ${tableName.replace('earm_', '').slice(0, -1)}`;
            
            const fieldsContainer = document.getElementById('modal-fields');
            fieldsContainer.innerHTML = '';

            config.forEach(field => {
                let inputHtml = '';
                if (field.type === 'select') {
                    inputHtml = `
                        <select id="field-${field.key}" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:border-blue-500 outline-none bg-white">
                            ${field.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                        </select>
                    `;
                } else {
                    inputHtml = `<input type="${field.type}" id="field-${field.key}" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:border-blue-500 outline-none" placeholder="${field.placeholder || ''}" ${field.required ? 'required' : ''}>`;
                }

                fieldsContainer.innerHTML += `
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">${field.label}</label>
                        ${inputHtml}
                    </div>
                `;
            });

            document.getElementById('item-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('item-modal').classList.add('hidden');
        }

        document.getElementById('modal-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tableName = document.getElementById('modal-table-name').value;
            const config = tableConfigs[tableName];
            
            const payload = {
                business_id: currentBusiness.id // Ensure correct ID is linked
            };

            config.forEach(field => {
                payload[field.key] = document.getElementById(`field-${field.key}`).value;
            });

            const { error } = await supabaseClient.from(tableName).insert([payload]);

            if (error) {
                showToast(error.message, 'error');
                console.error("Insert Error:", error);
            } else {
                showToast('Item added successfully', 'success');
                closeModal();
                const currentView = document.querySelector('.nav-item.bg-blue-50')?.id?.replace('nav-', '');
                if(currentView) router(currentView);
            }
        });

        async function deleteItem(tableName, id) {
            if(!confirm('Are you sure you want to delete this item?')) return;
            
            // SECURITY: Ensure we only delete from current business
            const { error } = await supabaseClient
                .from(tableName)
                .delete()
                .eq('id', id)
                .eq('business_id', currentBusiness.id);
            
            if (error) showToast(error.message, 'error');
            else {
                showToast('Item deleted', 'success');
                const currentView = document.querySelector('.nav-item.bg-blue-50')?.id?.replace('nav-', '');
                if(currentView) router(currentView);
            }
        }

        // --- 9. UTILS ---
        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            const colors = type === 'success' ? 'bg-green-600' : (type === 'error' ? 'bg-red-600' : 'bg-slate-800');
            toast.className = `${colors} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium fade-in flex items-center gap-2`;
            toast.innerHTML = `<span>${msg}</span>`;
            
            const container = document.getElementById('toast-container');
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
